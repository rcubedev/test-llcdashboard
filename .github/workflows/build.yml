name: Build

on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Build and test (${{ matrix.os }})
    # in a private repo windows minutes count double and macos ten times against the free 2000 a month
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache build-logic outputs
        uses: actions/cache@v6
        with:
          path: build-logic/build
          key: build-logic-${{ runner.os }}-${{ hashFiles('build-logic/src/**', 'build-logic/**/*.kts', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      # tests start their own PostgreSQL so there's nothing else to set up
      - name: Build and test
        run: ./gradlew build

      - name: Capture Build Artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-jar
          path: build/libs/dashboard.jar
          if-no-files-found: 'error'

  docker:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Docker image builds
    # what vercel (or any host) builds when deploying, so a broken Dockerfile shows up here first
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
